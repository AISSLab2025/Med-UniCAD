[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "med-unicad"
version = "1.0.0"
description = "Final MoFX-Dense implementation for unified multimodal and multitask medical CAD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "einops==0.8.1",
  "matplotlib==3.10.3",
  "numpy==2.1.2",
  "opencv-python==4.12.0.88",
  "pandas==2.3.1",
  "peft==0.17.1",
  "pillow==11.0.0",
  "scikit-learn==1.7.1",
  "scipy==1.15.3",
  "seaborn==0.13.2",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "transformers==4.57.1",
]

[project.optional-dependencies]
train = [
  "nltk==3.9.2",
  "openpyxl==3.1.5",
  "rouge-score",
  "tqdm==4.67.1",
]
api = [
  "fastapi==0.119.0",
  "python-multipart==0.0.20",
  "uvicorn==0.37.0",
]
dev = ["pytest>=8", "ruff==0.14.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
